name: Patch latest Gplex

on:
  schedule:
    - cron: "23 */2 * * *"   # every 2 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - gplex-plus-link-patch.py
      - docs2014/**
      - notify/**
      - gmail/**
      - plus/**
      - search/**
      - .github/workflows/patch.yml

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: patch

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      # (main.user.js there stopped at 7.2.21; Gplex went on under this name)
      UPSTREAM: https://raw.githubusercontent.com/Ziptino9098/Gplex-Fixed/main/Gplex_-_Old_Google_Frontend.user.js
      # Gplex's website gets new releases before GitHub does (7.2.15 was there first)
      UPSTREAM_SITE: https://gplexextended.com/download/latest.user.js
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest Gplex
        run: |
          curl -fsSL "$UPSTREAM" -o upstream.user.js
          if curl -fsSL "$UPSTREAM_SITE" -o site.user.js && grep -q "==UserScript==" site.user.js; then
            gh=$(grep -m1 '@version' upstream.user.js | awk '{print $3}' | tr -d '\r')
            site=$(grep -m1 '@version' site.user.js | awk '{print $3}' | tr -d '\r')
            newest=$(printf '%s\n%s\n' "$gh" "$site" | sort -V | tail -1)
            echo "GitHub $gh, website $site"
            if [ "$newest" = "$site" ] && [ "$site" != "$gh" ]; then
              mv site.user.js upstream.user.js
            fi
          fi
          rm -f site.user.js

      # (a copy of the Gplex this run built from, kept a week: for fixing an edit when Gplex's
      # website can't be reached from elsewhere)
      - name: Keep the downloaded Gplex
        uses: actions/upload-artifact@v4
        with:
          name: upstream
          path: upstream.user.js
          retention-days: 7

      # Rebuild only when upstream, the patch script, the Gmail or Docs fixes or the bell changed.
      - name: Check for changes
        id: state
        run: |
          # never an older Gplex than the one published (the website down, GitHub's copy behind)
          pub=$(grep -m1 '@version' main.user.js 2>/dev/null | awk '{print $3}' | tr -d '\r' | sed 's/\.[0-9]*$//')
          up=$(grep -m1 '@version' upstream.user.js | awk '{print $3}' | tr -d '\r')
          if [ -n "$pub" ] && [ "$(printf '%s\n%s\n' "$pub" "$up" | sort -V | tail -1)" != "$up" ]; then
            echo "Gplex $up is older than the published $pub (Gplex's website unreachable?): keeping the current build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key=$(cat upstream.user.js gplex-plus-link-patch.py gmail/*.py docs2014/* notify/* plus/* search/* | sha256sum | cut -d' ' -f1)
          if [ -f main.user.js ] && [ "$key" = "$(cat .state 2>/dev/null)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$key" > .state
          fi

      - name: Apply the Google+ link fix
        if: steps.state.outputs.changed == 'true'
        run: >
          python3 gplex-plus-link-patch.py upstream.user.js --out main.user.js --strict
          --update-url "https://raw.githubusercontent.com/${{ github.repository }}/main/main.user.js"
          --version-suffix "${{ github.run_number }}"
          --report skipped.txt

      - name: Syntax check
        if: steps.state.outputs.changed == 'true'
        run: node --check main.user.js

      - name: Publish
        if: steps.state.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add main.user.js .state
          msg="Patch Gplex $(grep -m1 '@version' main.user.js | awk '{print $3}')"
          if [ -s skipped.txt ]; then
            msg="$msg (left out: $(sed 's/ - .*//' skipped.txt | paste -sd ';' - | sed 's/;/; /g'))"
          fi
          git commit -m "$msg"
          git push

      # Features Gplex's new code left out of the build: an open issue says which (GitHub emails
      # about it), and is closed once a build has them all again.
      - name: Report features left out
        if: steps.state.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Some fixes are left out of the current build"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -s skipped.txt ]; then
            body=$(printf 'Gplex %s changed the code under these fixes, so this build (%s) went out without them:\n\n%s\n\nEverything else is in it. Fix the edits in gmail/edits.py and push.' \
              "$(grep -m1 '@version' upstream.user.js | awk '{print $3}' | tr -d '\r')" \
              "$(grep -m1 '@version' main.user.js | awk '{print $3}')" \
              "$(sed 's/^/- /' skipped.txt)")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
            # and Claude gets to work on them (fix-edits.yml merges its fix only if the checks pass)
            gh workflow run fix-edits.yml -f run_id="${{ github.run_id }}"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Build $(grep -m1 '@version' main.user.js | awk '{print $3}') has every fix again."
          fi
